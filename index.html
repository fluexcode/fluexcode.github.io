<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Bot Yönetim Paneli</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="admin-settings">
        <div class="admin-title">
            <span>⚙️ Bot Kontrol & Gelişmiş Şans Yönetimi</span>
            <span style="font-size: 13px; color: #adadb8;">Aktif Kanal: <strong id="currentChannelDisplay" style="color:#00f5d4;">davidkaan06</strong></span>
        </div>
        
        <div class="input-grid">
            <div class="input-group">
                <label for="targetChannelInput">HEDEF TWITCH KANALI</label>
                <input type="text" id="targetChannelInput" value="davidkaan06">
            </div>
            <div class="input-group">
                <label for="dcLinkInput">!dc (DISCORD) LİNKİ</label>
                <input type="text" id="dcLinkInput" value="https://discord.gg/h2As7yGG8b">
            </div>
            <div class="input-group">
                <label for="ytLinkInput">!yt (YOUTUBE) LİNKİ</label>
                <input type="text" id="ytLinkInput" value="https://www.youtube.com/@davidkaan2246">
            </div>
            <div class="input-group">
                <label for="svLinkInput">!sv (SERVER) LİNKİ</label>
                <input type="text" id="svLinkInput" value="https://lirin.to/register?ref=david">
            </div>
        </div>

        <div class="probability-section">
            <div class="prob-header">
                <span>📊 !kazan Komutu İhtimal Tablosu (Toplam Oran Önemli Değildir, Ağırlıklıdır)</span>
                <button type="button" class="add-row-btn" onclick="aralikEkle(1, 5, 1, 'Nadir')">+ Yeni Aralık Ekle</button>
            </div>
            <div id="probRowsContainer"></div>
        </div>
        
        <button class="save-btn" onclick="ayarlariKaydet()">💾 Ayarları Kaydet ve Botu Yeniden Başlat</button>
    </div>

    <div class="container">
        <div class="panel">
            <div class="panel-title chat-title">💬 Canlı Twitch Chat</div>
            <div id="chatLog" class="log-area"></div>
        </div>
        <div class="panel">
            <div class="panel-title terminal-title">💻 Geliştirici Terminali (Hata/Durum)</div>
            <div id="terminalLog" class="log-area"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
